# Swagger
version=1.0.0
title=External Occurrences API
description=API for external occurrence data (GBIF)
schemes=http
host=localhost:8080
basePath=/externalOccurrences-api/api
resourcePackage=com.strandls.externalOccurrences
prettyPrint=true
scan=true

# GBIF
gbif_parquet_path=/home/prakhar/workspace/gbif-cca/iter3/gbif-occurrence-final-with-ibp-gnparser.parquet
gbif_point_buffer_km=10
gbif_buffer_km=1
gbif_max_buffer_km=100
# Optional copy of (ibp_taxon_id, decimalLatitude, decimalLongitude) sorted by ibp_taxon_id, used by the
# taxon grid so it reads only that taxon's row groups. Falls back to gbif_parquet_path when empty or missing.
gbif_taxon_grid_parquet_path=/home/prakhar/workspace/gbif-cca/iter3/gbif-taxon-grid.parquet

# DuckDB
duckdb_database_path=/home/prakhar/workspace/gbif-cca/external_occurrences.db
duckdb_memory_limit=1GB
duckdb_threads=4
duckdb_temp_directory=/home/prakhar/workspace/gbif-cca/duckdb_temp
